# 风控参数模板（R-02a / ADR-16）——由 Dylan 审阅、填写后，复制为 config/risk/parameters.toml 并本人提交。
#
# - start 列出的是 V4.1 附录 A 的**草案值**，没有按你的资金规模与风险承受能力校准，必须逐项确认或修改。
# - hard_min / hard_max 是面板可调的硬性上下限，**故意留空**：不填完，文件无法加载，风控拒绝一切新增订单（默认最严）。
#   面板（API）只能在这个范围内调整；调严立即生效，调松须你本人二次确认。
# - 比例类参数取值 (0, 1]（例如 0.05 = 5% NAV）；笔数、毫秒、基点、交易日为正整数。
# - 杠杆（固定 1.0）、做空、衍生品（含期权）、市价单、风控口径是开关，不在这里，也不进面板。
# - 每个参数必须恰好有 start、hard_min、hard_max 三项；缺参数、多参数、多余键都会加载失败。
# - 重启后面板上保存的调严值仍然有效（比新 start 更严时）；想强制某个值，收窄 hard_min / hard_max。
#   修改本文件后，之前确认过的调松全部作废，需要重新确认。
# - protective_stop_distance 必须小于 1（等于 1 相当于不设止损）；数值最多 12 位小数，不接受 inf / nan。

