# apid 监听与认证（S-03）。普通运行配置，不是风控参数。
# 相对路径以本仓库根目录为基准，分隔符一律写 /。

[apid]
host = "127.0.0.1"          # 回环地址可以不用 TLS；改成局域网地址必须配置下面两项
port = 8730
api_db = "data/api.db"      # 令牌与审计（只存令牌哈希；不含交易数据）
tls_cert = ""               # 证书路径；空字符串表示不用 TLS（只允许回环地址）
tls_key = ""                # 私钥路径；生成与存放见 docs/runbooks/S-03-apid-auth.md
confirmation_seconds = 60   # 高危命令二次确认的有效期（最长 300 秒）
