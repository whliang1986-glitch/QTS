# 交易日历的临时覆盖（S-01f）：交易所临时宣布的休市或提前收市（国丧日、突发停市等），
# 日历库来不及更新时在这里登记。普通运行配置；tradingd 启动时加载，调度器与交易核心共用同一份日历。
#
# 只能“更严”：
# - adhoc_closures：把某个本来开市的交易日整天休市；
# - adhoc_early_closes：把某个交易日的收盘提前（时间按美东时间解释）。
# 不能新增开市日、不能推迟收盘；登记在本就休市的日子、日期重复、格式不对，都会让 tradingd 拒绝启动（退出码 78）。
# 删除这个文件等于没有任何临时登记。早于日历覆盖范围的旧登记会被忽略（不影响启动）。
#
# 例子：
#   adhoc_closures = [2026-12-24]
#
#   [[calendar.adhoc_early_closes]]
#   date = 2026-11-27
#   close = 13:00:00

[calendar]
adhoc_closures = []
