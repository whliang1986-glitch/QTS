name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每周二定时全量跑一次：没有新提交时也能发现“写死日期遇到真实时钟”这类定时炸弹（S-01f、B-05 各出过一次）
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 的控制台默认 cp1252，import-linter（rich）输出中文契约名会抛 UnicodeEncodeError
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true

      - name: 安装依赖（锁文件必须最新）
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check . --output-format github

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: import-linter 分层依赖契约
        run: uv run lint-imports --config pyproject.toml --no-logo

      - name: 唯一下单出口与风控绕过扫描
        run: uv run python scripts/arch_scan.py

      # 覆盖率只是报告，没有门槛：只在 ubuntu 上统计，Windows 不再承担覆盖率插桩的开销
      - name: pytest（含覆盖率）
        if: runner.os == 'Linux'
        run: uv run pytest --cov --cov-report=term-missing

      - name: pytest
        if: runner.os != 'Linux'
        run: uv run pytest

  web:
    name: 前端类型检查、构建与端到端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PW_CHANNEL: chrome  # 用 runner 自带的 Chrome，不下载 Playwright 浏览器
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 类型检查与正式构建
        run: npm run build

      # 视觉回归的截图基线是在 Windows 上生成的，Linux 字体渲染不同，这里不跑；本地 Windows 照常全跑
      - name: Playwright（视觉回归除外）
        run: npx playwright test --trace off --grep-invert "视觉回归"

  secret-scan:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: 扫描
        run: ./gitleaks git . --redact --no-banner --exit-code 1

      - name: 确认扫描器能拦截测试密钥
        run: |
          mkdir -p /tmp/canary
          printf 'TOKEN = "%s_%s"\n' ghp R7xQ2mVt9LpZ4kHs8NbWc3YdJf6Ug1Ae5Ko0 > /tmp/canary/settings.py
          if ./gitleaks dir /tmp/canary --no-banner --redact --exit-code 1; then
            echo "gitleaks 没有拦截测试密钥" && exit 1
          fi

  protected-paths:
    name: 受保护路径未被提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: secrets/ 不得入库
        run: |
          if git ls-files | grep -iE '(^|/)secrets/'; then
            echo "仓库中出现 secrets/ 下的文件" && exit 1
          fi
