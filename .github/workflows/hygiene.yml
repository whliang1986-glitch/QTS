name: 安全与工程卫生

# H-01：依赖漏洞扫描、许可证检查、无效代码扫描。
# 拉取请求和推送到 main 时跑一次；另外每周一定时全量跑一次，新公布的漏洞也能及时发现。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"  # 每周一 01:00 UTC（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 依赖漏洞、许可证与无效代码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true

      - name: 安装依赖（锁文件必须最新）
        run: uv sync --locked

      - name: pip-audit 依赖漏洞（有已知漏洞即失败）
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o requirements.audit.txt
          uv run pip-audit -r requirements.audit.txt --disable-pip --no-deps

      - name: 许可证检查（GPL、AGPL 等强传染许可即失败）
        run: uv run python scripts/check_licenses.py

      - name: vulture 无效代码（已清理，新增即失败）
        run: uv run vulture

  web:
    name: 前端依赖漏洞与无效代码
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: npm audit 生产依赖（高危及以上即失败）
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit 全部依赖（只提醒，开发工具不进正式构建）
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: knip 无效文件、导出与依赖（已清理，新增即失败）
        run: npx knip --no-progress
