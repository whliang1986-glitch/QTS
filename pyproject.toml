[project]
name = "quant"
version = "0.0.1"
description = "AI 量化自动交易系统：服务器常驻交易核心（tradingd / apid / workerd / guardd）"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
default-groups = ["dev"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server", "tests", "scripts", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N",
    "S",    # bandit：安全相关
    "DTZ",  # 禁止无时区的 datetime（ADR-12：内部一律 UTC）
    "T20",  # 禁止 print，统一走日志
    "PL",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点出现在字符串、文档和注释里
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]
"scripts/**" = ["T20", "S603", "S607"]
".claude/hooks/**" = ["T20", "S603", "S607"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["server", "tests", "scripts", ".claude/hooks"]
warn_unreachable = true
explicit_package_bases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["server"]
branch = true
