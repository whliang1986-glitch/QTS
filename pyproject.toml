[project]
name = "quant"
version = "0.0.1"
description = "AI 量化自动交易系统：服务器常驻交易核心（tradingd / apid / workerd / guardd）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "duckdb>=1.3,<2",
    "exchange-calendars>=4.13,<5",
    "fastapi>=0.115,<1",
    "keyring>=25,<26",
    "pandas>=3.0,<4",
    "pyarrow>=23.0.1,<24",  # 23.0.1 修复 PYSEC-2026-113（H-01 pip-audit）
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.36,<2.1",
    # zoneinfo 在 Windows 上没有系统时区库，全靠 tzdata（S-01e：显式声明，不依赖 pandas 的传递依赖）
    "tzdata>=2024.1",
    "uvicorn>=0.32,<1",
    "websockets>=13,<16",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "import-linter>=2.5",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20",
    "httpx>=0.27,<1",
    # H-01 工程卫生：无效代码扫描、依赖漏洞扫描
    "vulture>=2.14",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
default-groups = ["dev"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server", "tests", "scripts", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N",
    "S",    # bandit：安全相关
    "DTZ",  # 禁止无时区的 datetime（ADR-12：内部一律 UTC）
    "T20",  # 禁止 print，统一走日志
    "PL",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点出现在字符串、文档和注释里
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]
"tests/arch/test_order_exit_scan.py" = ["E501"]  # 用例表一行一条更易读
# 故意拼接原生 SQL 模拟绕过 Repository 直接改库（REPLACE / UPDATE / DELETE 攻击用例）
"tests/integration/storage/test_ledger.py" = ["E501", "S608"]
"scripts/**" = ["T20", "S603", "S607"]
".claude/hooks/**" = ["T20", "S603", "S607"]

# ---------- vulture（H-01：无效代码扫描）----------
# 逐项核对过的结论见 docs/hygiene/H-01-report.md。新增忽略项要在报告里写明原因与归属任务。
[tool.vulture]
paths = ["server", "tests", "scripts"]
exclude = ["server/storage/migrations/versions/"]  # alembic 按约定读取 revision 变量
min_confidence = 60
ignore_decorators = [
    "@app.*",                 # FastAPI 路由与异常处理（由框架调用）
    "@model_validator", "@field_validator",  # pydantic 校验器
    "@event.listens_for",     # SQLAlchemy 事件
    "@pytest.fixture", "@pytest_asyncio.fixture",
]
ignore_names = [
    # 框架约定的名字
    "model_config", "model_post_init", "__context", "prec", "should_exit", "visit_*",
    "pytestmark", "tzname", "dt", "tb", "__class__",
    # 数据契约字段：序列化输出或校验用，代码里不直接读取
    "retry_same_request_id", "changed_by", "base_currency", "exchange", "broker_contract_id",
    "bid_size", "ask_size", "account_ok", "risk_ok", "unit", "description",
    "requested", "already",  # S-05a：告警确认接口 AckResponse 的返回字段
    # 预留给后续任务（见报告）
    "OUTSIDE_TRADING_HOURS", "ORDER_PRECAUTION",  # B-05：IBKR 拒单原因映射
    "StrategyVersion", "params_hash",              # T-09：策略版本注册表
    "last_report",                                 # S-09：诊断包与日终报告
]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["server", "tests", "scripts", ".claude/hooks"]
warn_unreachable = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- import-linter（F-03）----------
# 分层依赖规则，CI 中 `uv run lint-imports` 违规即失败。调用级规则（唯一下单出口、
# 不得绕过风控、券商 SDK 隔离）由 scripts/arch_scan.py 负责。
[tool.importlinter]
root_package = "server"

[[tool.importlinter.contracts]]
id = "domain-independent"
name = "domain 不得依赖任何其他层"
type = "forbidden"
source_modules = ["server.domain"]
forbidden_modules = [
    "server.storage", "server.ipc", "server.broker", "server.oms", "server.risk",
    "server.data", "server.strategy", "server.backtest", "server.ai", "server.api",
    "server.guard", "server.platforms", "server.app",
]

[[tool.importlinter.contracts]]
id = "platforms-leaf"
name = "平台适配层只依赖标准库，不得依赖任何业务层（S-01b）"
# 操作系统差异只在这一层，业务代码不判断操作系统（tests/arch/test_platform_isolation.py）
type = "forbidden"
source_modules = ["server.platforms"]
forbidden_modules = [
    "server.domain", "server.storage", "server.ipc", "server.broker", "server.oms",
    "server.risk", "server.data", "server.strategy", "server.backtest", "server.ai",
    "server.api", "server.guard", "server.app",
]

[[tool.importlinter.contracts]]
id = "no-broker-from-decision-layers"
name = "strategy、ai、api 不得依赖 broker（直接或间接）"
type = "forbidden"
source_modules = ["server.strategy", "server.ai", "server.api"]
forbidden_modules = ["server.broker"]

[[tool.importlinter.contracts]]
id = "broker-importers-allowlist"
name = "只有 oms、guard、backtest、data、app（装配层）可以直接 import broker"
type = "forbidden"
source_modules = [
    "server.domain", "server.storage", "server.ipc", "server.risk",
    "server.strategy", "server.ai", "server.api", "server.platforms",
]
forbidden_modules = ["server.broker"]
# 只限直接 import：risk 需要调用 oms 的提交入口，而 oms 依赖 broker
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "no-api-from-ai-strategy"
name = "ai、strategy 不得依赖 api（R-02a：不能经 api 的包装函数间接调松风控参数或确认）"
type = "forbidden"
source_modules = ["server.ai", "server.strategy"]
forbidden_modules = ["server.api"]

[[tool.importlinter.contracts]]
id = "no-ledger-from-ai-strategy"
name = "ai、strategy 不得依赖 storage 与 risk（R-02a：不能伪造参数变更或风控决定）"
type = "forbidden"
source_modules = ["server.ai", "server.strategy"]
forbidden_modules = ["server.storage", "server.risk"]
# 包含间接依赖（安全优先）。将来 strategy 需要经 data 间接依赖 storage.config 时，不得整体放宽或加
# allow_indirect_imports：把禁止范围收窄到 server.storage.ledger 与 server.risk，并重新评审。

[[tool.importlinter.contracts]]
id = "no-channel-from-ai-strategy"
name = "ai、strategy 不得依赖平台层与进程间通道（S-01b：不能绕过 outbox 直连 tradingd）"
type = "forbidden"
source_modules = ["server.ai", "server.strategy"]
forbidden_modules = ["server.platforms", "server.ipc"]

[[tool.importlinter.contracts]]
id = "app-is-top"
name = "装配层在依赖图顶端：其他层不得依赖 app（S-01c 前置）"
# 依据：Dylan 2026-10-28 本人确认新增装配层 server/app（见 scripts/arch_scan.py 的 BROKER_IMPORT_ALLOWED）
type = "forbidden"
source_modules = [
    "server.domain", "server.storage", "server.ipc", "server.broker", "server.oms",
    "server.risk", "server.data", "server.strategy", "server.backtest", "server.ai",
    "server.api", "server.guard", "server.platforms",
]
forbidden_modules = ["server.app"]

[[tool.importlinter.contracts]]
id = "app-no-direct-oms"
name = "装配层不得直接依赖 oms：OrderManager 由 risk 的装配函数构造（S-01c 前置）"
type = "forbidden"
source_modules = ["server.app"]
forbidden_modules = ["server.oms"]
# 只限直接 import：app 经 risk 间接用到 oms 是装配的本意
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "fake-broker-test-only"
name = "FakeBroker 只给 backtest 与测试用（B-02），其他包不得依赖"
# 其他包不能借它的控制面绕过 clientId 隔离与撤单保护
type = "forbidden"
source_modules = [
    "server.domain", "server.storage", "server.ipc", "server.oms", "server.risk",
    "server.data", "server.strategy", "server.ai", "server.api", "server.guard",
    "server.platforms", "server.app",
]
forbidden_modules = ["server.broker.fake"]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
    # exchange_calendars 内部使用了 pandas 即将弃用的 Series.values（第三方，非本项目代码）
    "ignore:Series.values returning an ndarray:pandas.errors.Pandas4Warning",
    # starlette 的测试客户端建议改用 httpx2；httpx 仍可用，只影响测试（S-02）
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["server"]
branch = true
