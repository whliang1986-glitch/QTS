# 安装：uv run pre-commit install（或 pre-commit install）
# 手动全量：pre-commit run --all-files
# 本地钩子依赖 uv 与 gitleaks 在 PATH 上。
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/specs/
      - id: end-of-file-fixer
        exclude: ^docs/specs/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: protected-paths
        name: 受保护路径检查（config/risk、config/live、secrets）
        entry: uv run --no-sync python scripts/check_protected_paths.py
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks
        name: gitleaks 密钥扫描（暂存区）
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy（strict）
        entry: uv run --no-sync mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: arch-tests
        name: 架构与受保护路径测试
        entry: uv run --no-sync pytest -q tests/arch
        language: system
        pass_filenames: false
        always_run: true
